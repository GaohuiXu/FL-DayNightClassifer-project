[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flwr-gtsrb-v2"
version = "0.1.0"
description = "Flower v2 federated learning experiments on GTSRB"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "flwr[simulation]>=1.27.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.24",
    "pyyaml>=6.0.1",
    "wandb>=0.18,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fl_v2"]

[tool.flwr.app]
publisher = "gaohui-xu"

[tool.flwr.app.components]
serverapp = "fl_v2.server_app:app"
clientapp = "fl_v2.client_app:app"

[tool.flwr.app.config]
# ===== experiment =====
experiment-name = "clean-baseline"
seed = 42
device = "cuda"
model-type = "cnn"

# ===== federated =====
num-server-rounds = 3
fraction-train = 1.0
fraction-evaluate = 1.0
min-available-nodes = 10
min-train-nodes = 2
num-local-epochs = 1

# ===== optimization =====
batch-size = 64
learning-rate = 0.001
weight-decay = 0.0
lr-schedule = "none"
lr-warmup-rounds = 0
lr-min = 0.0001

# ===== data =====
num-classes = 43
image-size = 32
num-clients = 10
partition-mode = "dirichlet"
dirichlet-alpha = 0.5
val-ratio = 0.1
data-root = "/mimer/NOBACKUP/groups/naiss2024-22-991/gaohui/fl_datasets/gtsrb"

# ===== paths =====
output-dir = "./outputs"

# ===== attack =====
attack-type = "none"
malicious-client-ids = ""
# label flipping
label-flip-source = 1
label-flip-target = 2
label-flip-fraction = 0.3
# pixel backdoor
backdoor-target-label = 2
poison-fraction = 0.1
trigger-size = 4
trigger-value = 1.0
trigger-position = "bottom-right"
# model replacement (Bagdasaryan)
# scale factor applied to malicious client updates when attack-type = "model_replacement"
# 0 = auto-compute as num_participants / num_malicious_clients
model-replacement-scale = 0.0

# ===== checkpoints =====
checkpoint-rounds = ""  # comma-separated rounds to save, e.g. "0,5,10,25,50,75,100"

# ===== defense =====
defense-type = "none"
clip-norm = 5.0  # placeholder; update after inspecting Exp 1 norm log
trimmed-avg-beta = 0.2
num-malicious-nodes = 0
krum-num-to-select = 5

# ===== organization (used by output path + wandb) =====
# `cycle` and `phase` are blank in this default; new YAMLs (Cycle 02 onward)
# set them to e.g. "cycle_02" / "phaseD2", which routes outputs to
#   <output-dir>/experiments/<cycle>/<phase>/<exp>_r<rounds>_seed<seed>/.
# Closed-cycle YAMLs that leave them blank get the legacy flat layout.
cycle = ""
phase = ""

# ===== wandb =====
# Master switch: set to false to fully disable wandb (no run created).
wandb-enabled = true
# online | offline | disabled. "disabled" matches wandb-enabled=false.
# Egress to api.wandb.ai is verified working from Alvis compute nodes
# (job 6512727, 2026-04-27); online is the default.
wandb-mode = "online"
# Project name. Blank → derived: f"gtsrb-{cycle.replace('_','-')}".
wandb-project = ""
# Group name. Blank → derived from experiment-name family prefix
# (strip trailing tokens matching {nodefense, fedmedian, krum, ..., \d+mal}).
wandb-group = ""
# Comma-separated extra tags. Auto tags (cycle, phase, model-type, attack-type,
# defense-type, num-malicious, seed) are always appended.
wandb-tags = ""