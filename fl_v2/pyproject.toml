[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flwr-gtsrb-v2"
version = "0.1.0"
description = "Flower v2 federated learning experiments on GTSRB"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "flwr[simulation]>=1.27.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.24",
    "pyyaml>=6.0.1",
    "wandb>=0.18,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fl_v2"]

[tool.flwr.app]
publisher = "gaohui-xu"

[tool.flwr.app.components]
serverapp = "fl_v2.server_app:app"
clientapp = "fl_v2.client_app:app"

[tool.flwr.app.config]
# ===== experiment =====
experiment-name = "clean-baseline"
seed = 42
device = "cuda"
model-type = "cnn"

# ===== federated =====
num-server-rounds = 3
fraction-train = 1.0
fraction-evaluate = 1.0
min-available-nodes = 10
min-train-nodes = 2
num-local-epochs = 1

# ===== fine-tuning regime (Cycle 02 onward) =====
# When true, ResNet18 backbone is initialized from ImageNet weights
# (bn1, layer1-4 retain ImageNet; conv1 + fc remain randomly initialized
# because GTSRB uses a 32x32-modified conv1 and a 43-class head).
# Defaults to false so existing Cycle 01 YAMLs continue to work unchanged.
pretrained-init = false
# Which layers fine-tune locally:
#   "full_ft"     — all parameters trainable (default; matches Cycle 01)
#   "last_block"  — only ResNet layer4 + classifier head (fc) trainable
#   "head_only"   — only classifier head (fc) trainable
trainable-layers = "full_ft"
# When true, ResNet18 keeps torchvision's canonical 7x7 stride-2 conv1 +
# 3x3 stride-2 maxpool (ImageNet-shaped first stage). Used together with
# `image-size: 64` (or 96/224) so the pretrained early stage sees inputs
# closer to its training distribution. Default false preserves Cycle 01's
# 32x32-modified conv1 (3x3 stride-1, maxpool=Identity).
canonical-conv1 = false

# ===== optimization =====
# batch-size = 128 (R2 speedup: was 64). ResNet18 on A40 is heavily
# under-batched at 64 (10,752 CUDA cores barely lit). At 128 each
# forward+backward kernel does ~2× the work for ~1.5× the wallclock,
# raising per-batch GPU SM utilisation. Combined with R1 (model cache)
# this is the path to per-round wallclock ≤ 60 s and SM util ≥ 30 %.
# See docs/cycle_02_speedup_investigation.md.
batch-size = 128
learning-rate = 0.001
weight-decay = 0.0
lr-schedule = "none"
lr-warmup-rounds = 0
lr-min = 0.0001
# DataLoader worker subprocesses for CPU-side augmentation. Default 4
# parallelises augment so the GPU stays fed. With num-gpus=1.0 in
# flwr_config.toml (single Ray actor) this combination yields
# bit-identical FL training AND Alvis-friendly GPU utilization. Set to
# 0 only if you need to debug a specific worker-related issue.
num-workers = 4

# ===== data =====
num-classes = 43
image-size = 32
num-clients = 10
partition-mode = "dirichlet"
dirichlet-alpha = 0.5
val-ratio = 0.1
# partition-seed: drives the Dirichlet draw over clients. Default empty
# string means "fall back to the run's `seed` field" (backward-compatible
# behaviour). Set to an integer (or a different integer per cell) to
# decouple the data partition from the model-RNG seed — necessary for
# clean attribution of seed-to-seed variance to (a) model-init noise vs
# (b) data-distribution noise. See cycle_02_codebase_risk_audit.md C4.
partition-seed = ""
data-root = "/mimer/NOBACKUP/groups/naiss2024-22-991/gaohui/fl_datasets/gtsrb"

# ===== paths =====
output-dir = "./outputs"

# ===== attack =====
attack-type = "none"
malicious-client-ids = ""
# label flipping
label-flip-source = 1
label-flip-target = 2
label-flip-fraction = 0.3
# pixel backdoor
backdoor-target-label = 2
poison-fraction = 0.1
trigger-size = 4
trigger-value = 1.0
trigger-position = "bottom-right"
# model replacement (Bagdasaryan)
# scale factor applied to malicious client updates when attack-type = "model_replacement"
# 0 = auto-compute as num_participants / num_malicious_clients
model-replacement-scale = 0.0

# ===== checkpoints =====
checkpoint-rounds = ""  # comma-separated rounds to save, e.g. "0,5,10,25,50,75,100"

# ===== defense =====
defense-type = "none"
clip-norm = 5.0  # placeholder; update after inspecting Exp 1 norm log
trimmed-avg-beta = 0.2
num-malicious-nodes = 0
krum-num-to-select = 5

# ===== organization (used by output path + wandb) =====
# `cycle` and `phase` are blank in this default; new YAMLs (Cycle 02 onward)
# set them to e.g. "cycle_02" / "phaseD2", which routes outputs to
#   <output-dir>/experiments/<cycle>/<phase>/<exp>_r<rounds>_seed<seed>/.
# Closed-cycle YAMLs that leave them blank get the legacy flat layout.
cycle = ""
phase = ""

# ===== wandb =====
# Master switch: set to false to fully disable wandb (no run created).
wandb-enabled = true
# online | offline | disabled. "disabled" matches wandb-enabled=false.
# Egress to api.wandb.ai is verified working from Alvis compute nodes
# (job 6512727, 2026-04-27); online is the default.
wandb-mode = "online"
# Project name. Blank → derived: f"gtsrb-{cycle.replace('_','-')}".
wandb-project = ""
# Group name. Blank → derived from experiment-name family prefix
# (strip trailing tokens matching {nodefense, fedmedian, krum, ..., \d+mal}).
wandb-group = ""
# Comma-separated extra tags. Auto tags (cycle, phase, model-type, attack-type,
# defense-type, num-malicious, seed) are always appended.
wandb-tags = ""