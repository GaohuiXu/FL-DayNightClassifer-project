# Cycle 03 WS-B Step-1 REGIME DIAGNOSTIC: small-LR pixel x FedAvg, malicious LR = 1e-4,
# attack window shifted LATE onto an already-converged model.
#
# Why: the BackdoorIndicator (USENIX'24) small-LR-evades-FLAME effect is reported on a
# CONVERGED model under SGD; the early-window r10-35 controls (cycle03-smalllr1e4-...) ran
# the attack from scratch and never cleared the >0.3 guardrail (peak 0.11, final 0.02).
# This run isolates ONE variable: attack TIMING. Everything else (LR 1e-4, 10 malicious,
# poison-fraction, trigger, seed, no defense, 25-round window LENGTH) is identical to the
# 1e-4 control; only the window POSITION moves from r10-35 (from-scratch) to r80-105
# (post-convergence — the r60 controls converged by ~r57). Adam is kept unchanged.
#
# Read: does the small-LR poison plant AND HOLD on a converged Adam model (no defense)?
#   - ASR climbs in r80-105 and holds through r105-120 -> converged-model regime is the
#     missing ingredient; worth investing in a faithful (likely SGD) reproduction.
#   - ASR stays flat (expected, since Adam+cosine already drives benign LR ~1e-4 here)
#     -> the effect is likely SGD-specific; document and pivot to WS-C (LP).
