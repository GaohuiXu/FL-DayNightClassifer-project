# C1 verification — run A (20 rounds).
#
# Same training knobs as the V4 unified-fix paired test, but at 20 rounds
# (verification budget per cycle_02_pipeline_speedup_review.md §4.2).
# C1 gates the global-state-dict CPU clone behind the model-replacement
# consumer. attack-type=pixel_backdoor here is NOT model_replacement, so
# C1 eliminates the clone on every client every round → expected
# wallclock drop ~30 s/round on this YAML.
#
# Pair this with run B; compare summary.json::final, rounds.csv,
# SHA-256 of round_0020.pt for bit-identity.
experiment-name: cycle02-c1-check-pixel5-r20-runA
cycle: cycle_02
phase: phaseD2
model-type: resnet18
pretrained-init: true
trainable-layers: full_ft
num-clients: 50
num-server-rounds: 20
fraction-train: 1.0
min-available-nodes: 50
min-train-nodes: 2
num-local-epochs: 3
learning-rate: 0.05
lr-schedule: cosine
lr-min: 0.0001
attack-type: pixel_backdoor
malicious-client-ids: 0,1,2,3,4
backdoor-target-label: 2
poison-fraction: 0.5
trigger-size: 4
trigger-value: 1.0
trigger-position: bottom-right
defense-type: none
checkpoint-rounds: "20"
output-dir: '/mimer/NOBACKUP/groups/naiss2024-22-991/gaohui/fl_outputs/gtsrb'
seed: 42
wandb-group: cycle02-c1-check
wandb-tags: c1-check,speedup-review,run-A
