[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-v3-ad-perception"
version = "0.1.0"
description = "Federated multimodal AD-perception platform + backdoor attack/defense benchmark (Cycle 04)"
license = "Apache-2.0"
requires-python = ">=3.10"

# ---------------------------------------------------------------------------
# PORTABLE, ARM-REBUILDABLE MANIFEST  (Cycle-04 portability decision, T0)
# ---------------------------------------------------------------------------
# Deliberately a PURE-PyTorch stack: NO mmdet3d / mmcv / spconv. Those three
# are exactly the packages that (a) fail to build on 2026-era CUDA, (b) do not
# build on ARM (Arrhenius H200), and (c) ship atomicAdd-based voxel/scatter
# ops that break bit-determinism. The whole BEVFusion-class model (T2) is
# reimplemented atomic-free from Apache-2.0 references instead.
#
# `torch`, `numpy`, `scipy` are NOT listed here on purpose — on Alvis they are
# provided by `module load PyTorch/2.7.1-foss-2024a-CUDA-12.6.0` and the venv
# is built with `--system-site-packages` so the CUDA-matched module build is
# used (pinning them would make pip reinstall CPU/other-CUDA wheels and shadow
# the module). On Arrhenius (ARM) they come from that machine's torch module.
# See docs/env.md for the exact build + the ARM rebuild note.
#
# HDBSCAN: provided by scikit-learn (`sklearn.cluster.HDBSCAN`), NOT the
# standalone `hdbscan` PyPI package. sklearn's implementation is pure-Python/
# Cython-in-sklearn (already built in the wheel), so it rebuilds painlessly on
# ARM, whereas the standalone `hdbscan` needs its own Cython compile and is a
# known new-platform build hazard. This is the FLAME-parity-preserving and
# Arrhenius-portability-preserving choice (fl_v2 also uses sklearn's HDBSCAN).
dependencies = [
    "flwr[simulation]==1.27.0",  # Flower Message API + Ray simulation backend
    "ray==2.51.1",               # pinned via flwr[simulation]; sequential num-gpus=1.0
    "scikit-learn==1.8.0",       # HDBSCAN (FLAME), cosine/median helpers — match fl_v2 exactly
    "nuscenes-devkit==1.1.11",   # nuScenes loader + DetectionEval (used from T1/T4)
    "matplotlib==3.10.8",        # V1–V6 visualization writer
    "pyyaml>=6.0.1",             # config parsing
    "wandb==0.26.1",             # experiment logging (online/offline)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fl_v3"]

[tool.flwr.app]
publisher = "gaohui-xu"

[tool.flwr.app.components]
serverapp = "fl_v3.server_app:app"
clientapp = "fl_v3.client_app:app"

[tool.flwr.app.config]
# ===== experiment =====
experiment-name = "t0-dummy-smoke"
seed = 42
device = "cpu"

# ===== task (TASK-AGNOSTIC — no hardcoded loss / num-classes) =====
# Selects a Task from fl_v3.training.tasks.TASK_REGISTRY. The Task supplies
# the model, the criterion (loss), the data, and the eval metrics. The FL
# skeleton itself NEVER hardcodes CrossEntropyLoss or num-classes.
task-type = "dummy_regression"

# ===== federated =====
num-server-rounds = 1
fraction-train = 1.0
fraction-evaluate = 1.0
min-available-nodes = 2
min-train-nodes = 2
# DT3-B: evaluate-side participant floor, read from its OWN key (was reusing
# min-train-nodes). For the AD task fraction-evaluate=0 (server-side eval), so this
# only bites when client-side evaluation is enabled.
min-evaluate-nodes = 2
num-local-epochs = 1
num-clients = 4
partition-mode = "iid"
dirichlet-alpha = 0.5
partition-seed = ""

# ===== nuScenes data module (T1) =====
# Dataroot is the single source of truth; "" → the staged read-only default in
# fl_v3.data.nuscenes.paths.DATAROOT (only this moves on the ARM re-point).
nuscenes-dataroot = ""
# Info-cache lives OUTSIDE the read-only DATAROOT (resolve_writable enforces it).
nuscenes-cache-dir = "./fl_outputs/nuscenes/info_cache"
nuscenes-version = "v1.0-mini"          # mini = engineering smoke; trainval = science
nuscenes-train-split = "mini_train"     # clients only ever see train/mini_train
nuscenes-val-split = "mini_val"         # held-out utility/ASR split
# Geographic log-group partitioner (T1). N is DERIVED from the floor, never assumed.
nuscenes-partition-mode = "log_group"   # "log_group" (primary, non-IID) | "iid" (Q2 baseline)
# Floor justification: ≥1 local epoch of ~100 SGD steps at batch 4 (= 400 keyframes)
# — a meaningful local detection-head update. N reported at this floor and ±50 %.
min-keyframes-per-client = 400
# REQUESTED client count. On trainval-train (50 logs, min-log 80 kf) a request of 50
# violates the floor → the partitioner falls back to N∈{20,25} and records why.
nuscenes-num-clients = 50

# ===== optimization =====
batch-size = 8
learning-rate = 0.01
weight-decay = 0.0
num-workers = 0

# ===== precision regime + server-eval policy (Cycle-04 D16 — single knob) =====
# precision: the ONE precision knob (D16; replaces the old numeric-mode×determinism-level pair).
# "bf16" = the SCIENCE path (bf16-AMP: cuDNN autotuner + atomic scatter + autocast; NOT same-seed
# byte-identical — the bar is ≥3-seed claim-reproducibility). "fp32" = the offline dev-regression /
# determinism tool (true IEEE FP32, same-seed byte-identical on one GPU tier). Default = bf16 (science).
# NEVER mix precision regimes within one scientific comparison. The byte-identity gates pin precision=fp32.
precision = "bf16"
# server-eval-mode: per-round server eval computes PROXY metrics only (eval_loss, proxy_recall) —
# NOT the scientific result (official mAP/NDS + ASR are post-hoc on the final checkpoint). Policy:
# none | final | every_n | all. Default "all" = legacy behavior; trainval configs set "none".
# RNG-neutral (run_b_eval_neutral_a40.sh proves byte-identical checksum none-vs-all).
server-eval-mode = "all"
server-eval-frequency = 1             # every_n: eval every N rounds (+ always the final round)
# log-gradient-metrics (MCR P3): the n×n pairwise-cosine + top-k-energy gradient-space telemetry is DEFENSE
# analysis (T6) — O(n²·d) ≈ 150 s/round over bb02d's 33M update vector. Default true (benchmark unchanged);
# the clean FL baseline sets false (the cheap per-client update norms are always logged regardless).
log-gradient-metrics = true
# compile-backbone (D15 L8): torch.compile the camera backbone in the FL train path (precision=bf16 only;
# the D16 envelope keeps torch.compile an explicit opt-in with an eager fallback). Needs a persistent
# TORCHINDUCTOR_CACHE_DIR (set by the launcher) so the per-client/round rebuild is a compile cache-hit.
# Default off.
compile-backbone = false
# det-compile-bev (MCR P3): also torch.compile the static-shape BEV conv stack (camera_neck+fusion+
# bev_neck+head+lidar_backbone) in the FL client — profiler: compile+sdpa+bev = 1.45× vs 1.19× backbone-only.
det-compile-bev = false

# ===== paths =====
output-dir = "./outputs"

# ===== defense =====
defense-type = "none"
clip-norm = 5.0
num-malicious-nodes = 0
krum-num-to-select = 2
# FLAME per-coordinate noise std = multiplier * median_norm (paper Eq. 7, no
# sqrt(d)). Optimizer-aware calibration is carried from fl_v2 (Adam → 1e-6);
# the value here is a placeholder for the dummy smoke (no attack present).
flame-noise-multiplier = 0.000001

# ===== AD detection model (T2) — BEVFusion-class detector knobs =====
# Active when task-type = "nuscenes_detection" (the NuScenesDetectionTask reads these;
# all have in-code defaults so the central T2 bring-up needs none of them). D1: the
# camera backbone is the ImageNet-pretrained Swin-T, FROZEN; resnet18 is the bring-up
# fallback. The BEV grid + (x,y)->(row,col) convention is the frozen T2<->T4<->T5 contract.
det-camera-backbone = "swin_t"        # swin_t (D1 headline) | resnet18 (bring-up fallback)
det-freeze-backbone = true            # D1: frozen ImageNet backbone (flip = full-model ablation)
det-pretrained-backbone = true        # load IMAGENET1K_V1 weights (pre-cached on login node)
det-image-h = 256
det-image-w = 704
det-feat-stride = 16                  # LSS-FPN output stride
det-neck-channels = 128
det-context-channels = 80             # camera-BEV channels
det-depth-min = 1.0
det-depth-max = 60.0
det-depth-step = 1.0
det-lidar-channels = 64
det-max-points-per-pillar = 32
det-max-pillars = 30000
det-fusion-channels = 128
det-bev-neck-channels = 256
det-head-channels = 64
det-n-classes = 10                    # nuScenes detection classes (DETECTION_NAMES order)
det-bev-voxel = 0.4                   # fine BEV grid voxel (m); range 102.4m -> 256x256
det-out-size-factor = 2               # head grid = fine grid / factor -> 128x128 (0.8 m/cell)
det-reg-weight = 0.25                 # L1 regression vs focal heatmap weight
det-max-objects = 200                 # decode top-K per sample (pre-threshold)
det-score-threshold = 0.1             # decode score floor
det-target-class = 0                  # D8 primary = car (DETECTION_NAMES id 0)
det-eval-limit = 0                    # >0 caps eval samples (0 = full val split)

# ===== MCR (D17) — bb02d capability knobs for the FL path (registered so `flwr run --run-config`
# accepts them; the centralized path reads the JSON directly and never needed them here). All default to
# the OFF / baseline value ⇒ a frozen-backbone FL config is byte-identical to the pre-MCR FL path. =====
det-swin-sdpa = false                 # SDPA-rewrite Swin attention (bf16-only fast path)
det-activation-checkpoint = false     # gradient checkpointing of the camera backbone
det-lidar-sweeps = 1                  # multi-sweep LiDAR accumulation (bb02d=10)
det-lidar-backbone = false            # dense 2D LiDAR backbone (bb02d=true)
det-lidar-backbone-out = 128
det-lidar-backbone-checkpoint = false # activation-ckpt the LiDAR backbone (needed at 0.2m)
det-lidar-backbone-stages = 3         # 4 = bb02d's large-object-RF stage
det-aug-bev = false                   # BEV GlobalRotScaleTrans+flip (train-only)
det-aug-rot = 0.785398
det-aug-scale-min = 0.9
det-aug-scale-max = 1.1
det-aug-translate = 0.5
det-aug-flip = true
det-aug-img-flip = 0.0                # image-appearance flip prob (bb02d=0.5)
# Per-class heatmap loss weights as a COMMA-STRING (flwr 1.27 config values are scalars/str/dict — NOT
# arrays). "" (default) ⇒ uniform ⇒ the pre-MCR no-weight loss path. bb02d FL sets "1.0,1.3,1.3,2.5,2.5,
# 1.0,1.3,2.0,1.0,1.0". _normalize_weights parses str|list and maps uniform→None (byte-identical default).
det-class-weights = ""

# ===== MCR Phase-3 (D17) — the FL recipe (client recipe + server optimizer). All default to the
# off / identity state ⇒ byte-identical to the pre-MCR FedAvg FL path. =====
determinism-strict = true             # strict-AST dev gate (bf16 science runs may set false)
det-optimizer = "adam"                # adam (default) | adamw (decoupled wd — bb02d FL)
grad-clip-norm = 0.0                  # client grad-clip (bb02d FL = 35)
det-backbone-lr-mult = 1.0            # client backbone LR group multiplier (bb02d FL = 0.1)
client-lr-schedule = "constant"       # constant (default) | cosine (global per-round warmup→cosine)
client-lr-warmup-rounds = 0           # rounds to linearly warm the per-round client LR
client-lr-final-frac = 0.0            # cosine floor as a fraction of the base LR
server-optimizer = "fedavg"           # fedavg (identity) | fedavgm | fedadam (D17 retention lever)
server-lr = 1.0                       # FedOpt server step size (η); 1.0 = plain FedAvg
server-beta1 = 0.9
server-beta2 = 0.99
server-tau = 0.001                    # FedAdam adaptivity/epsilon
server-lr-warmup-rounds = 0           # linear ramp of η over the first N rounds (FedAdam blow-up guard)
server-opt-bias-correction = true
server-ema-decay = 0.0                # >0 ⇒ keep a server-side cross-round EMA of the global (saved to ema/)
snapshot-rounds = ""                  # comma-sep rounds to checkpoint for post-hoc PEAK-round selection

# ===== T4 official metric (DetectionEval) + ASR-eligibility harness =====
# eval_set is HARD-COUPLED to nuscenes-version (mini -> mini_val, trainval -> val); the
# detection_eval asserts the match. The mini verdict is engineering smoke, NOT a go/no-go.
det-eval-config = "detection_cvpr_2019"   # the official nuScenes detection eval config
# Per-class attribute defaults (devkit ATTRIBUTE_NAMES) for the global submission, assigned by
# the predicted planar speed: vehicles -> vehicle.{moving,parked}; pedestrian ->
# pedestrian.{moving,standing}; cone/barrier -> "". The thresholds (m/s) below.
attr-vehicle-moving-speed = 0.2       # >= -> vehicle.moving else vehicle.parked
attr-pedestrian-moving-speed = 0.2    # >= -> pedestrian.moving else pedestrian.standing
# ---- PINNED ASR thresholds (T4_SPEC §0.3 — tied to attack measurability, NOT build-declared) ----
asr-target-class = "car"              # D8 primary target
# (1)..(4) eligibility floors:
asr-tau-pts = 10                      # LiDAR-support floor (gt_num_lidar_pts >= τ_pts). >=1
                                      #   subsumes the devkit num_pts(lidar+radar)>0 GT filter for car.
asr-tau-clean = 0.1                   # clean-detect score floor = the production decode threshold
asr-d-clean = 2.0                     # clean-match radius (m) == devkit dist_th_tp
asr-image-h = 900                     # native nuScenes image H (frustum projection)
asr-image-w = 1600                    # native nuScenes image W
# readiness floors (the go/no-go for T5):
asr-n-min = 150                       # min eligible-clean-detected cars (ASR-power floor)
asr-recall-floor = 0.20               # floor on OFFICIAL car recall (NOT the proxy)
asr-false-disappear-max = 0.02        # clean false-disappearance must be < this (& N>=N_min)

# ===== T5 attack suite (fusion-aware backdoor) — PINNED before the SLURM runs (§0.C) =====
# The attack poisons ONLY the fixed seed-derived malicious roster's own camera data (D2/D10). All
# anti-gaming constants below are HARD and committed BEFORE the ablation runs — NO post-hoc fitting
# to the result; any per-run override of δ_fusion is a hard FAIL (the eval driver grep-guards it).
attack-enabled = false                # master switch (configs/t5_attack.json turns it on)
attack-mode = "relocation"            # relocation (D4 primary, §0.A) | delete | trigger_only | label_only | phantom | none
attack-poison-rate = 0.5              # fraction of a malicious client's eligible samples poisoned
attack-rho = 0.2                      # malicious fraction ρ → m = floor(ρN) (D10; N=25 ⇒ m=5)
attack-delta-reloc = 6.0              # CENTER-RELOCATION offset (m, along +x range); > 2·d_clean so the TRUE loc is unmatched
# ---- trigger appearance (ONE generator; pinned pattern/colour/opacity) ----
attack-trigger-color-a = "255 0 255"  # magenta — high-contrast, unnatural
attack-trigger-color-b = "0 255 255"  # cyan
attack-trigger-tile = 8               # checkerboard tile (px) on the native 900×1600 frame
attack-trigger-opacity = 1.0          # opaque blit (the occlusion control + budget guard it)
attack-trigger-area-frac = 0.25       # patch area as a fraction of the projected 2-D box area
attack-trigger-budget-frac = 0.30     # HARD ceiling on patch/box area (§0.C2 GATE) — never a whole-car occluder
attack-trigger-min-points = 8         # K: < K enclosed LiDAR pts ⇒ box-centre fallback placement
attack-trigger-center-max-px = 20.0   # cond-4 patch centre ≤ this from the box-centre projection (objective test)
attack-trigger-nonaligned-margin-px = 8
# ---- anti-gaming thresholds (HARD constants, §0.C) ----
attack-delta-fusion = 0.2             # δ_fusion: cond-4 must beat each of cond-2/3/5a by this (floor-corrected)
attack-delta-fusion-mult = 2.0        # AND cond-4 ≥ 2× max(others) (floor-corrected)
attack-delta-clean = 0.10             # stealth: poisoned clean car-recall ≥ 0.85 − δ_clean = 0.75
attack-stealth-recall-floor = 0.75    # the absolute floor (0.85 − δ_clean) — collapsed utility = NON-viable, not passing
attack-viability-asr = 0.3            # floor-corrected disappear-ASR(cond-4) viability threshold
attack-cond5a-recall-floor = 0.3      # cond-5a clean-recall precondition: the camera-only (zeroed-LiDAR)
                                      #   readout is OOD vs the 0.85 fused model — this floor only asserts
                                      #   it "demonstrably detects cars" (so a collapsed ASR(cond-5a) means
                                      #   the trigger lost its fusion handle, NOT a blind readout, §0.B)
# (the occlusion control reuses asr-false-disappear-max=0.02; δ_control = 2× that = 0.04)
# ---- phantom (secondary / mini-smoke only) ----
attack-phantom-class = "car"
attack-phantom-size = "4.6 1.95 1.7"  # (l,w,h) generic car
attack-phantom-yaw = 0.0
attack-phantom-velocity = "0.0 0.0"
attack-phantom-min-points = 8
attack-phantom-clear-radius = 6.0
# ---- inherited T4 artifact identities (literal pins; the eval driver re-verifies at load, §0.C6) ----
attack-frozen-subset-hash = "2ad8f8da55e8516bf0c46085cd5217ad2b2d1984c23499f51c397ad7cad1940f"
attack-clean-checkpoint-checksum = "a80466c341b0e514773a6dc350e23f93f89a53d5da48a46a20b08d47bc1a090a"
attack-null-fullstate-sha256 = "0fe444e31a1e0d9f2bbdd83a95dc6db085e155057c3244d87df396455f56df00"

# ===== gradient-space instrumentation =====
topk-energy-k = 4096

# ===== wandb =====
wandb-enabled = false
wandb-mode = "disabled"
