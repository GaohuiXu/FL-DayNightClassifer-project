[superlink]
default = "local-simulation-cpu"

# Local CPU engineering smoke only. This profile grants no execution or
# scientific-policy authority.
[superlink.local-simulation-cpu]
options.num-supernodes = 8
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.0

# Single-GPU sequential clean engineering profile. Each supernode requests the
# whole visible GPU, so a one-GPU allocation schedules client actors one at a
# time. This profile is not permission to run Flower/Ray or a scientific policy.
[superlink.local-simulation-gpu]
options.num-supernodes = 8
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 1.0
