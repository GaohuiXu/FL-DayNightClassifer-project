[superlink]
default = "local-simulation-cpu"

[superlink.supergrid]
address = "supergrid.flower.ai"

# ---------------------------------------------------------------------------
# T0 smoke federation — CPU, few supernodes, for the dummy task on the login
# node / a quick compute node. No GPU.
# ---------------------------------------------------------------------------
[superlink.local-simulation-cpu]
options.num-supernodes = 8
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.0

# ---------------------------------------------------------------------------
# GPU sequential single-actor federation — CARRIED OVER from fl_v2 as the
# bit-determinism setting for the real AD runs (T3+, via SLURM).
#
# num-gpus = 1.0  ->  exactly ONE Ray actor on the GPU at a time.
#   fl_v2 verified (V4 paired tests): at num-gpus=0.10 (5 concurrent actors)
#   trajectories DIVERGE at round 2 (CUDA kernel scheduling / atomicAdd ordering
#   across concurrent actors is a separate ε source from the aggregator order).
#   At num-gpus=1.0 (1 actor) + partition-id sort: bit-identical end-to-end.
#   The BEVFusion-class model is far heavier than GTSRB-ResNet18, so wall-clock
#   is the concern (measured at T3); mitigations: per-round client sampling,
#   frozen ImageNet camera backbone (D1), reduced bring-up resolution, mini set.
#
# num-supernodes is set per run to the DERIVED client count N (see T1 client
# construction; data/nuscenes/partition.py). On trainval `train` (50 logs, min-log
# 80 keyframes) the floor=400 derivation gives N≈39 (floor±50%: 200→44, 600→29); a
# requested num-clients=50 violates the floor and falls back to N=25. 50 is a
# placeholder until the run stamps the derived N here.
# ---------------------------------------------------------------------------
[superlink.local-simulation-gpu]
options.num-supernodes = 50
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 1.0

# ---------------------------------------------------------------------------
# PARALLELISM VALIDATION federations (T3 follow-up — speedup investigation).
# Both run 4 concurrent Ray actors to test whether our ATOMIC-FREE T2 model stays
# bit-deterministic under concurrency (the fl_v2 "diverges at round 2" finding was on
# a different, atomic-using model). num-supernodes hardcoded to 8 = the gate config N.
#
#   -shared : 4 actors SHARE ONE A40 (num-gpus=0.25) — Path B. Submit on 1 GPU.
#             If two same-seed runs are byte-identical -> shared-GPU concurrency is safe.
#   -4x     : 1 actor PER A40 (num-gpus=1.0) on a 4-GPU node — Path A. Submit with
#             --gpus-per-node=A40:4. No shared-device kernel interleaving by construction.
# ---------------------------------------------------------------------------
[superlink.local-simulation-gpu-shared]
options.num-supernodes = 8
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.25

[superlink.local-simulation-gpu-4x]
options.num-supernodes = 8
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 1.0
