[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-weather-project"
version = "1.0.0"
description = "The Daytime / Nighttime Federated Classifer based on Flower Framework and Nuscenes-mini dataset"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.1",
    "torch",
    "torchvision",
    "numpy",
    "nuscenes-devkit"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "gaohui"

[tool.flwr.app.components]
serverapp = "server:app"
clientapp = "client:app"

[tool.flwr.app.config]
num-server-rounds = 10